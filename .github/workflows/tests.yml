name: Unit tests
on:
  push:
  pull_request:
jobs:
  national-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Scoring rules (national score)
        run: cd pipeline && python -m pytest -q
      - name: Sample data builds
        run: OUT_DIR=/tmp/sample python pipeline/make_sample_data.py
  illinois-fiscal-pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: illinois-fiscal-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m municipal_risk.cli --input examples/synthetic_data.csv --output /tmp/scores.csv
