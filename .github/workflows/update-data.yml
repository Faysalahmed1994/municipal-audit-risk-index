name: Update data from Federal Audit Clearinghouse

on:
  schedule:
    - cron: "17 9 * * 4"   # every Thursday 09:17 UTC (FAC updates on Wednesdays)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test scoring rules
        run: |
          pip install pytest
          cd pipeline && python -m pytest -q
      - name: Build dataset
        env:
          FAC_API_KEY: ${{ secrets.FAC_API_KEY }}
        run: python pipeline/build_dataset.py
      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git push
          fi
